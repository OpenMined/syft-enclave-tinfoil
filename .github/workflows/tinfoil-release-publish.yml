# DO NOT RUN MANUALLY. This workflow is dispatched automatically by
# `tinfoil-release.yml` against the newly created release tag.
#
# Computes the expected CVM launch measurement for tinfoil-config.yml, creates
# the GitHub release carrying it, and signs it keylessly to Sigstore via GitHub
# OIDC. Nothing is built or pulled here: the measurement covers the CVM launch
# state and the config, and the container image appears only as a digest.
#
# Kept in step with tinfoilsh/tinfoil-containers-template — the supported path.
# This copy lives in PySyft for review; the live one is in the config repo.
name: Tinfoil Release - Publish (auto-triggered)

run-name: Publish release ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: tinfoil-container-release-${{ github.ref_name }}

jobs:
  measure-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      packages: write       # attach the attestation to the image
      id-token: write       # keyless attestation signing
      attestations: write   # publish the attestation

    steps:
      - name: Measure image, attest, and publish the release
        uses: tinfoilsh/measure-image-action@f2ec2fdf4510459730f0a5158c5817f5361e9461 # v0.13.2
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
